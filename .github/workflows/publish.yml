name: Publish

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Confirm that this workflow should publish a release
        required: true
        type: boolean
        default: false

jobs:
  publish:
    if: ${{ inputs.confirm_release && github.repository_owner == 'kvnloughead' }}

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v7.0.1

      - name: Install Node and NPM
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Publish releases
        env:
          # The APPLE_* values are used for auto updates signing
          APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # This is used for uploading release assets to github
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm exec electron-builder -- --publish always
